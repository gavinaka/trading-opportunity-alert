[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-opportunity-alerts"
version = "0.1.0"
description = "TradingView-driven Taker candidate alerts derived from Trading-System logic without modifying Trading-System."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
